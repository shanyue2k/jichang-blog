<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 500" width="364" height="500" role="img" aria-labelledby="t d">
<title id="t">Clash Meta for Android 首页界面示意图</title>
<desc id="d">首页顶部是显示已停止的启动卡片，下方依次是代理、配置、日志、设置等入口。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2833"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c99a00"/></marker><style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#1d2833}
.n{font-size:26px;font-weight:700}
.h{font-size:19px;font-weight:700}
.s{font-size:15px;fill:#5d6875}
.b{font-size:16px;font-weight:600}
.box{fill:#fff;stroke:#c9d0d7;stroke-width:1.5}
.direct{stroke:#1d2833;stroke-width:2.5;fill:none;marker-end:url(#a)}
.proxy{stroke:#c99a00;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#ay)}
</style></defs>
<rect width="364" height="500" fill="#f3f5f7"/>
<rect x="20" y="16" width="300" height="468" rx="28" fill="#fff" stroke="#1d2833" stroke-width="3"/>
<rect x="130" y="26" width="80" height="8" rx="4" fill="#c9d0d7"/>
<g transform="translate(20 44)">
<text x="18" y="30" class="b">Clash Meta for Android</text>
<rect x="14" y="54" width="272" height="78" rx="12" fill="#1d2833"/>
<text x="34" y="88" style="font-size:19px;font-weight:700;fill:#fff">已停止</text>
<text x="34" y="114" style="font-size:14px;fill:#c9d1da">点此启动</text>
<rect x="14" y="150" width="272" height="56" rx="10" fill="#f3f5f7"/><text x="34" y="176" class="b">代理</text><text x="34" y="196" style="font-size:13px;fill:#5d6875">选择节点、切换模式</text><rect x="14" y="216" width="272" height="56" rx="10" fill="#f3f5f7"/><text x="34" y="242" class="b">配置</text><text x="34" y="262" style="font-size:13px;fill:#5d6875">导入和管理订阅</text><rect x="14" y="282" width="272" height="56" rx="10" fill="#f3f5f7"/><text x="34" y="308" class="b">日志</text><text x="34" y="328" style="font-size:13px;fill:#5d6875">连接记录</text><rect x="14" y="348" width="272" height="56" rx="10" fill="#f3f5f7"/><text x="34" y="374" class="b">设置</text><text x="34" y="394" style="font-size:13px;fill:#5d6875">网络、访问控制</text><circle cx="324" cy="93" r="13" fill="#ffcc00" stroke="#1d2833" stroke-width="1.5"/><text x="324" y="98" text-anchor="middle" style="font-size:14px;font-weight:700">3</text><circle cx="324" cy="178" r="13" fill="#ffcc00" stroke="#1d2833" stroke-width="1.5"/><text x="324" y="183" text-anchor="middle" style="font-size:14px;font-weight:700">4</text><circle cx="324" cy="244" r="13" fill="#ffcc00" stroke="#1d2833" stroke-width="1.5"/><text x="324" y="249" text-anchor="middle" style="font-size:14px;font-weight:700">2</text></g>
<text x="170" y="470" text-anchor="middle" style="font-size:12px;fill:#8c99a6">示意图，按钮位置以实际 App 为准</text>
</svg>
