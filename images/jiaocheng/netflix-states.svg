<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 516" width="520" height="516" role="img" aria-labelledby="t d">
<title id="t">Netflix 节点的三种状态对照图</title>
<desc id="d">三种状态：完全解锁可以看当地全部片库；仅自制剧只能看 Netflix 原创；代理报错直接提示正在使用解锁器或代理。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2833"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c99a00"/></marker><style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#1d2833}
.n{font-size:26px;font-weight:700}
.h{font-size:19px;font-weight:700}
.s{font-size:15px;fill:#5d6875}
.b{font-size:16px;font-weight:600}
.box{fill:#fff;stroke:#c9d0d7;stroke-width:1.5}
.direct{stroke:#1d2833;stroke-width:2.5;fill:none;marker-end:url(#a)}
.proxy{stroke:#c99a00;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#ay)}
</style></defs>
<rect width="520" height="516" fill="#f3f5f7"/>
<text x="20" y="38" class="h">Netflix 节点的三种状态</text><g transform="translate(12 58)"><rect width="496" height="138" rx="10" fill="#fff" stroke="#d8dde3" stroke-width="1.5"/><rect width="8" height="138" rx="4" fill="#1f9d55"/><text x="24" y="32" class="b" style="font-size:17px;font-weight:700">完全解锁</text><text x="24" y="62" class="s"><tspan style="fill:#1d2833;font-weight:600">看到：</tspan>能搜到当地授权的非原创影视</text><text x="24" y="90" class="s"><tspan style="fill:#1d2833;font-weight:600">原因：</tspan>节点 IP 未被识别为代理</text><text x="24" y="118" class="s"><tspan style="fill:#1d2833;font-weight:600">处理：</tspan>正常观看，片库随节点地区变化</text></g><g transform="translate(12 208)"><rect width="496" height="138" rx="10" fill="#fff" stroke="#d8dde3" stroke-width="1.5"/><rect width="8" height="138" rx="4" fill="#d97a00"/><text x="24" y="32" class="b" style="font-size:17px;font-weight:700">仅自制剧</text><text x="24" y="62" class="s"><tspan style="fill:#1d2833;font-weight:600">看到：</tspan>只剩带 N 标志的原创，其他搜不到</text><text x="24" y="90" class="s"><tspan style="fill:#1d2833;font-weight:600">原因：</tspan>IP 被部分识别，只放开自制内容</text><text x="24" y="118" class="s"><tspan style="fill:#1d2833;font-weight:600">处理：</tspan>换标注「解锁」或 NF 的节点</text></g><g transform="translate(12 358)"><rect width="496" height="138" rx="10" fill="#fff" stroke="#d8dde3" stroke-width="1.5"/><rect width="8" height="138" rx="4" fill="#cf3b3b"/><text x="24" y="32" class="b" style="font-size:17px;font-weight:700">代理报错</text><text x="24" y="62" class="s"><tspan style="fill:#1d2833;font-weight:600">看到：</tspan>提示正在使用解锁器或代理</text><text x="24" y="90" class="s"><tspan style="fill:#1d2833;font-weight:600">原因：</tspan>IP 已被 Netflix 列入代理名单</text><text x="24" y="118" class="s"><tspan style="fill:#1d2833;font-weight:600">处理：</tspan>换节点；整个机场都这样就换机场</text></g>
</svg>
