<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c4855"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d99a00"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <!-- border -->
  <line x1="470" y1="38" x2="470" y2="452" stroke="#cf3b3b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="470" y="26" text-anchor="middle" font-size="13" fill="#cf3b3b" font-weight="700">出境（国际出口）</text>
  <text x="250" y="26" text-anchor="middle" font-size="13" fill="#5d6875">国内</text>
  <text x="640" y="26" text-anchor="middle" font-size="13" fill="#5d6875">海外</text>

  <g font-size="13">
  <!-- row template: label at x=20 -->
  <!-- 1 直连 -->
  <g transform="translate(0 50)">
    <rect x="12" y="0" width="736" height="90" rx="8" fill="#f7f9fb"/>
    <text x="28" y="26" font-size="15" font-weight="700" fill="#1d2833">① 直连</text>
    <text x="28" y="48" fill="#5d6875">最便宜</text><text x="28" y="66" fill="#5d6875">晚高峰易慢</text>
    <rect x="170" y="38" width="80" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="210" y="60" text-anchor="middle">你的设备</text>
    <path d="M252 55 H 578" stroke="#3c4855" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
    <text x="400" y="47" text-anchor="middle" fill="#cf3b3b">公网出口（晚上拥堵）</text>
    <rect x="582" y="38" width="96" height="34" rx="6" fill="#1d2833"/><text x="630" y="60" text-anchor="middle" fill="#fff">海外节点</text>
  </g>

  <!-- 2 中转 -->
  <g transform="translate(0 150)">
    <rect x="12" y="0" width="736" height="90" rx="8" fill="#f7f9fb"/>
    <text x="28" y="26" font-size="15" font-weight="700" fill="#1d2833">② 中转</text>
    <text x="28" y="48" fill="#5d6875">先到国内</text><text x="28" y="66" fill="#5d6875">服务器再出境</text>
    <rect x="170" y="38" width="80" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="210" y="60" text-anchor="middle">你的设备</text>
    <path d="M252 55 H 300" stroke="#3c4855" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="304" y="38" width="96" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="352" y="60" text-anchor="middle">国内中转机</text>
    <path d="M402 55 H 578" stroke="#3c4855" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
    <text x="490" y="47" text-anchor="middle" fill="#d97a00">优化过的公网出口</text>
    <rect x="582" y="38" width="96" height="34" rx="6" fill="#1d2833"/><text x="630" y="60" text-anchor="middle" fill="#fff">海外节点</text>
  </g>

  <!-- 3 BGP -->
  <g transform="translate(0 250)">
    <rect x="12" y="0" width="736" height="90" rx="8" fill="#f7f9fb"/>
    <text x="28" y="26" font-size="15" font-weight="700" fill="#1d2833">③ BGP 中转</text>
    <text x="28" y="48" fill="#5d6875">入口自动选</text><text x="28" y="66" fill="#5d6875">最快的运营商</text>
    <rect x="170" y="38" width="80" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="210" y="60" text-anchor="middle">你的设备</text>
    <path d="M252 55 H 300" stroke="#3c4855" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="304" y="30" width="96" height="50" rx="6" fill="#fff" stroke="#1d2833"/><text x="352" y="51" text-anchor="middle">BGP 多线入口</text><text x="352" y="69" text-anchor="middle" font-size="11" fill="#5d6875">电信/联通/移动</text>
    <path d="M402 55 H 578" stroke="#d99a00" stroke-width="3" marker-end="url(#ay)"/>
    <text x="490" y="47" text-anchor="middle" fill="#d99a00">出境段：专线或优化出口</text>
    <rect x="582" y="38" width="96" height="34" rx="6" fill="#1d2833"/><text x="630" y="60" text-anchor="middle" fill="#fff">海外节点</text>
  </g>

  <!-- 4 专线 -->
  <g transform="translate(0 350)">
    <rect x="12" y="0" width="736" height="90" rx="8" fill="#fff6cc" stroke="#f0d36b"/>
    <text x="28" y="26" font-size="15" font-weight="700" fill="#1d2833">④ IPLC/IEPL</text>
    <text x="28" y="48" fill="#5d6875">不走公网</text><text x="28" y="66" fill="#5d6875">最稳也最贵</text>
    <rect x="170" y="38" width="80" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="210" y="60" text-anchor="middle">你的设备</text>
    <path d="M252 55 H 300" stroke="#3c4855" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="304" y="38" width="96" height="34" rx="6" fill="#fff" stroke="#1d2833"/><text x="352" y="60" text-anchor="middle">国内入口</text>
    <path d="M402 51 H 578" stroke="#d99a00" stroke-width="3"/>
    <path d="M402 59 H 578" stroke="#d99a00" stroke-width="3" marker-end="url(#ay)"/>
    <text x="490" y="43" text-anchor="middle" fill="#a87400" font-weight="700">跨境专线（独享）</text>
    <rect x="582" y="38" width="96" height="34" rx="6" fill="#1d2833"/><text x="630" y="60" text-anchor="middle" fill="#ffcc00">海外节点</text>
  </g>
  </g>
</svg>
