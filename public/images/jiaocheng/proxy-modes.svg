<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 566" width="520" height="566" role="img" aria-labelledby="t d">
<title id="t">规则、全局、直连三种代理模式的流量走向示意图</title>
<desc id="d">规则模式下国内网站直连、国外网站经机场节点；全局模式下所有流量都经过节点；直连模式下所有流量都不经过节点。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2833"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c99a00"/></marker><style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#1d2833}
.n{font-size:26px;font-weight:700}
.h{font-size:19px;font-weight:700}
.s{font-size:15px;fill:#5d6875}
.b{font-size:16px;font-weight:600}
.box{fill:#fff;stroke:#c9d0d7;stroke-width:1.5}
.direct{stroke:#1d2833;stroke-width:2.5;fill:none;marker-end:url(#a)}
.proxy{stroke:#c99a00;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#ay)}
</style></defs>
<rect width="520" height="566" fill="#f3f5f7"/>
<line x1="16" y1="26" x2="52" y2="26" class="direct"/><text x="60" y="31" class="s">直接访问</text><line x1="150" y1="26" x2="186" y2="26" class="proxy"/><text x="194" y="31" class="s">经过机场节点</text><g transform="translate(0 50)"><rect x="12" y="0" width="496" height="160" rx="10" fill="#fff8d6" stroke="#ffcc00" stroke-width="2"/><text x="30" y="32" class="h">规则</text><text x="88" y="32" class="s">日常推荐：国内直连，国外走节点</text><rect x="30" y="74" width="96" height="46" rx="8" class="box"/><text x="78" y="103" class="b" text-anchor="middle">手机/电脑</text><rect x="206" y="80" width="92" height="34" rx="17" fill="#1d2833"/><text x="252" y="102" class="b" text-anchor="middle" style="fill:#ffcc00">机场节点</text><rect x="380" y="50" width="112" height="40" rx="8" class="box"/><text x="436" y="76" class="b" text-anchor="middle">国内网站</text><rect x="380" y="106" width="112" height="40" rx="8" class="box"/><text x="436" y="132" class="b" text-anchor="middle">国外网站</text><path d="M126 88 C 220 52, 300 56, 376 68" class="direct"/><path d="M126 102 L 202 98" class="proxy"/><path d="M298 100 C 330 104, 350 122, 376 124" class="proxy"/></g><g transform="translate(0 222)"><rect x="12" y="0" width="496" height="160" rx="10" fill="#fff" stroke="#d8dde3" stroke-width="1.5"/><text x="30" y="32" class="h">全局</text><text x="88" y="32" class="s">所有流量都走节点，国内也绕路</text><rect x="30" y="74" width="96" height="46" rx="8" class="box"/><text x="78" y="103" class="b" text-anchor="middle">手机/电脑</text><rect x="206" y="80" width="92" height="34" rx="17" fill="#1d2833"/><text x="252" y="102" class="b" text-anchor="middle" style="fill:#ffcc00">机场节点</text><rect x="380" y="50" width="112" height="40" rx="8" class="box"/><text x="436" y="76" class="b" text-anchor="middle">国内网站</text><rect x="380" y="106" width="112" height="40" rx="8" class="box"/><text x="436" y="132" class="b" text-anchor="middle">国外网站</text><path d="M126 97 L 202 97" class="proxy"/><path d="M298 92 C 330 84, 350 72, 376 70" class="proxy"/><path d="M298 104 C 330 110, 350 122, 376 124" class="proxy"/></g><g transform="translate(0 394)"><rect x="12" y="0" width="496" height="160" rx="10" fill="#fff" stroke="#d8dde3" stroke-width="1.5"/><text x="30" y="32" class="h">直连</text><text x="88" y="32" class="s">相当于暂停代理，国外打不开</text><rect x="30" y="74" width="96" height="46" rx="8" class="box"/><text x="78" y="103" class="b" text-anchor="middle">手机/电脑</text><rect x="206" y="80" width="92" height="34" rx="17" fill="#e3e7eb"/><text x="252" y="102" class="b" text-anchor="middle" style="fill:#8c99a6">不使用</text><rect x="380" y="50" width="112" height="40" rx="8" class="box"/><text x="436" y="76" class="b" text-anchor="middle">国内网站</text><rect x="380" y="106" width="112" height="40" rx="8" class="box" stroke-dasharray="5 4"/><text x="436" y="132" class="b" text-anchor="middle" style="fill:#8c99a6">国外网站</text><path d="M126 88 C 220 52, 300 56, 376 68" class="direct"/><path d="M126 106 C 220 140, 300 140, 364 128" stroke="#cf3b3b" stroke-width="2.5" fill="none"/><text x="364" y="134" style="font-size:18px;font-weight:700;fill:#cf3b3b">✕</text></g>
</svg>
