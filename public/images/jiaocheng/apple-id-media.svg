<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 658" width="340" height="658" role="img" aria-labelledby="t d">
<title id="t">iPhone Apple 账户设置页示意图</title>
<desc id="d">在设置中点你的名字进入 Apple 账户页面，切换外区账号应点媒体与购买项目，不要退出 iCloud。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2833"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c99a00"/></marker><style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#1d2833}
.n{font-size:26px;font-weight:700}
.h{font-size:19px;font-weight:700}
.s{font-size:15px;fill:#5d6875}
.b{font-size:16px;font-weight:600}
.box{fill:#fff;stroke:#c9d0d7;stroke-width:1.5}
.direct{stroke:#1d2833;stroke-width:2.5;fill:none;marker-end:url(#a)}
.proxy{stroke:#c99a00;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#ay)}
</style></defs>
<rect width="340" height="658" fill="#f3f5f7"/>
<rect x="20" y="16" width="300" height="626" rx="28" fill="#fff" stroke="#1d2833" stroke-width="3"/>
<rect x="130" y="26" width="80" height="8" rx="4" fill="#c9d0d7"/>
<g transform="translate(20 44)">
<text x="18" y="28" style="font-size:22px;fill:#1557b0">‹</text><text x="150" y="28" text-anchor="middle" class="b">Apple 账户</text>
<circle cx="150" cy="80" r="30" fill="#e3e7eb"/><text x="150" y="88" text-anchor="middle" style="font-size:22px;fill:#8c99a6">你</text>
<text x="150" y="134" text-anchor="middle" class="b">你的名字</text>
<rect x="14" y="152" width="272" height="36" fill="#fff" stroke="#e3e7eb"/><text x="30" y="176" style="font-size:14.5px">个人信息</text><text x="270" y="176" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="188" width="272" height="36" fill="#fff" stroke="#e3e7eb"/><text x="30" y="212" style="font-size:14.5px">登录与安全</text><text x="270" y="212" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="224" width="272" height="36" fill="#fff" stroke="#e3e7eb"/><text x="30" y="248" style="font-size:14.5px">付款与配送</text><text x="270" y="248" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="260" width="272" height="36" fill="#fff" stroke="#e3e7eb"/><text x="30" y="284" style="font-size:14.5px">订阅</text><text x="270" y="284" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="314" width="272" height="40" fill="#fdecec" stroke="#cf3b3b" stroke-width="2"/><text x="30" y="340" style="font-size:14.5px;font-weight:600">iCloud</text><text x="270" y="340" text-anchor="end" style="font-size:13.5px;font-weight:700;fill:#cf3b3b">✕ 不要动</text><rect x="14" y="354" width="272" height="40" fill="#e6f6ec" stroke="#1f9d55" stroke-width="2"/><text x="30" y="380" style="font-size:14.5px;font-weight:600">媒体与购买项目</text><text x="270" y="380" text-anchor="end" style="font-size:13.5px;font-weight:700;fill:#1f9d55">✓ 在这里切换</text><rect x="14" y="394" width="272" height="40" fill="#fff" stroke="#e3e7eb" stroke-width="1"/><text x="30" y="420" style="font-size:14.5px;font-weight:400">查找</text><text x="270" y="420" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="434" width="272" height="40" fill="#fff" stroke="#e3e7eb" stroke-width="1"/><text x="30" y="460" style="font-size:14.5px;font-weight:400">家人共享</text><text x="270" y="460" text-anchor="end" style="font-size:14px;fill:#c9d0d7">›</text><rect x="14" y="490" width="272" height="64" rx="10" fill="#fff8d6" stroke="#ffcc00"/><text x="28" y="516" style="font-size:13.5px">外区账号只登录在「媒体与购买项目」，</text><text x="28" y="538" style="font-size:13.5px">照片、通讯录所在的 iCloud 保持原样。</text></g>
<text x="170" y="628" text-anchor="middle" style="font-size:12px;fill:#8c99a6">示意图，按钮位置以实际 App 为准</text>
</svg>
